{{- $pages := where site.RegularPages "Type" "in" site.Params.mainSections }}
{{- if and (gt (len $pages) 1) (in $pages . ) }}
<nav>
    {{- with $pages.Next . }}
        <a class="prev" href="{{ .Permalink }}">{{ i18n "prev_page" }}</a>
    {{- end }}
    {{- with $pages.Prev . }}
        <a class="next" href="{{ .Permalink }}">{{ i18n "next_page" }}</a>
    {{- end }}
</nav>
{{- end }}
