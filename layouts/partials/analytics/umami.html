{{- /* Umami Analytics (cookieless), production only.
       params.analytics.umami: src, websiteId, performance (Core Web Vitals). */ -}}
{{- with site.Params.analytics.umami -}}
{{- if and .src .websiteId (eq hugo.Environment "production") -}}
<script defer src="{{ .src }}"
  data-website-id="{{ .websiteId }}"
  {{- if .performance }}
  data-performance="true"
  {{- end }}></script>
{{ end -}}
{{- end -}}
