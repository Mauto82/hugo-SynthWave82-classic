# Default configuration of the SynthWave82 Classic theme.
# Hugo merges these values with the site's own: the site always wins.

[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"

# llms.txt for AI agents and a Markdown version of every page.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[params]
  shortTitle = "SynthWave82"
  tutorialVisiblePosts = 3
  [params.home]
    postSummary = true
    showPaginatorArrows = true
  [params.post]
    showCategories = true
    showTags = true
    showMeta = true
    showReadingTime = true
    showAuthor = true
    showNav = true
  [params.footer]
    showTags = true
    showCategories = true
    showSocial = true
    maxFooterListItems = 10
